---
# 用途：OS Patch 前記錄目標 Server 嘅 Kernel 狀態，並檢查預期 Process。
# 執行內容：uname -a → 寫入 ~/tmp_os_before.txt → 顯示 Kernel → 呼叫原有 check_process Role。
# 注意：會喺目標機寫入檔案；此處使用 check_process，唔係 check_process_king。

- name: Record system state before OS patching
  hosts: all
  gather_facts: false
  tasks:
    - name: Read kernel information
      command: uname -a
      register: kernel_before
      changed_when: false

    - name: Save kernel information on target host
      copy:
        content: "{{ kernel_before.stdout }}\n"
        dest: "~/tmp_os_before.txt"
        mode: '0600'

    - name: Display kernel information
      debug:
        var: kernel_before.stdout

    - name: Check expected processes
      include_role:
        name: check_process
