---
# Run as a Tower Job Template. Supply the two required extra vars:
# maintenance_date: "2026-10-18" (maintenance START date in JST)
# wait_target_time: "24:05"    (next-day 00:05 JST)
# Connect the next Workflow Job on SUCCESS only.
- name: Wait for scheduled maintenance gate (JST)
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Enforce wait until maintenance time
      include_role:
        name: wait_until_time
