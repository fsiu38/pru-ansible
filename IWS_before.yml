# IWS_before.yml
---
# MDM: record/release FTA WS limit, then unlink FTA
- hosts: mdm_dev
  become: false
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Control IWSFTA WS Limit Control (Before)
      include_role:
        name: Workstation_control/fta_ws_limit_control_before
      vars:
        fta_target_ws: "{{ item }}"
      loop: "{{ groups['fta_ws'] }}"

    - name: FTA Unlink
      include_role:
        name: Workstation_control/fta_unlink
      vars:
        fta_target_ws: "{{ item }}"
      loop: "{{ groups['fta_ws'] }}"

# FTA停止 (sudo defaults from ansible.cfg)
- hosts: fta_dev
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Stop IWSFTA
      include_role:
        name: Workstation_control/stop_iwsfta
