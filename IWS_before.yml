---
# 用途：OS Patch 前嘅 IWS 停機準備。
# 執行順序：由 mdm_dev 記錄／調整 FTA WS Limit → FTA Unlink → 喺 fta_dev 停止 IWSFTA。
# 注意：任何 block 失敗會進入 rescue，執行 fail；本 Playbook 會實際改變 IWS/FTA 狀態。

---
#IWS FTA Test Linux 前 OSパッチ前作業 FTA Limit状態記録と制限解除へ
- hosts: mdm_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: Control IWSFTA WS Limit Control (Before)
          include_role:
            name: Workstation_control/fta_ws_limit_control_before
          vars:
            fta_target_ws: "{{ item }}"
          loop: "{{ groups['fta_ws'] }}"
      rescue:
        - name: Control IWSFTA WS Limit Control (Before) failure
          ansible.builtin.fail:
            msg: "Control IWSFTA WS Limit Control (Before) failed! ({{ ansible_failed_result.item | default('unknown') }})"

# FTA AgentとUnlink
- hosts: mdm_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: FTA Unlink
          include_role:
            name: Workstation_control/fta_unlink
          vars:
            fta_target_ws: "{{ item }}"
          loop: "{{ groups['fta_ws'] }}"
      rescue:
        - name: FTA Unlink failure
          ansible.builtin.fail:
            msg: "FTA Unlink failed! ({{ ansible_failed_result.item | default('unknown') }})"

# FTA停止
- hosts: fta_dev
  gather_facts: no
  tasks:
    - block:
        - name: Stop IWSFTA
          include_role:
            name: Workstation_control/stop_iwsfta
      rescue:
        - name: Stop IWSFTA failure
          ansible.builtin.fail:
            msg: "Stop IWSFTA failed"