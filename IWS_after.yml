---
# 用途：OS Patch 完成後，依序恢復 IWSFTA、重新連結 FTA、檢查 FTA/DA Process、恢復 WS Limit，最後執行 RMSTDLIST 檢查。
# 執行對象：fta_dev、mdm_dev、da_dev；實際操作透過 Workstation_control 相關 Role。
# 注意：部分步驟失敗會進入 rescue，並使用 end_play 結束目前 Play；請留意 Workflow 後續行為。

---
# IWSFTA開始
- hosts: fta_dev
  gather_facts: no
  tasks:
    - block:
        - name: Start IWSFTA
          include_role:
            name: Workstation_control/start_iwsfta
      rescue:
        - name: Start IWSFTA failure
          debug:
            msg: "Start IWSFTA failed!"
        - meta: end_play

# FTA AgentとLink
- hosts: mdm_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: FTA Link
          include_role:
            name: Workstation_control/fta_link
          vars:
            fta_target: "{{ item }}"
          loop: "{{ groups['fta_ws'] }}"
      rescue:
        - name: FTA Link failure
          debug:
            msg: "FTA Link failed! ({{ ansible_failed_result.item | default('unknown') }})"
        - meta: end_play

# IWSFTA Process Check
- hosts: fta_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: IWSFTA Process Check
          include_role:
            name: Workstation_control/fta_process_check
      rescue:
        - name: IWSFTA Process Check failure
          debug:
            msg: "IWSFTA Process Check failed!"
        - meta: end_play

# IWSDA Process Check
- hosts: da_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: IWSDA Process Check
          include_role:
            name: Workstation_control/da_process_check
      rescue:
        - name: IWSDA Process Check failure
          debug:
            msg: "IWSDA Process Check failed!"
        - meta: end_play

# FTA Limit状態を作業前に戻す
- hosts: mdm_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: Control IWSFTA WS Limit Control (After)
          include_role:
            name: Workstation_control/fta_ws_limit_control_after
          vars:
            fta_target_ws: "{{ item }}"
          loop: "{{ groups['fta_ws'] }}"
      rescue:
        - name: Control IWSFTA WS Limit Control (After) failure
          debug:
            msg: "Control IWSFTA WS Limit Control (After) failed!"
        - meta: end_play

# FTA RMSTDLIST実行
- hosts: mdm_dev
  become: false
  gather_facts: no
  tasks:
    - block:
        - name: RMSTDLISTの実行
          include_role:
            name: Workstation_control/after_fta_check
          vars:
            JSControl: "{{ item }}"
          loop: "{{ IWSFTA_Aftercheck_JOB }}"
      rescue:
        - name: RMSTDLISTの実行 failure
          ansible.builtin.fail:
            msg: "RMSTDLISTの実行 failed! ({{ ansible_failed_result.item | default('unknown') }})"
        - meta: end_play