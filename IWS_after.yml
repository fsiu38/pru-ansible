# IWS_after.yml
---
# IWSFTA開始
- hosts: fta_dev
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Start IWSFTA
      include_role:
        name: Workstation_control/start_iwsfta

# FTA Agent Link
- hosts: mdm_dev
  become: false
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: FTA Link
      include_role:
        name: Workstation_control/fta_link
      vars:
        fta_target: "{{ item }}"
      loop: "{{ groups['fta_ws'] }}"

# IWSFTA Process Check
- hosts: fta_dev
  become: false
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: IWSFTA Process Check
      include_role:
        name: Workstation_control/fta_process_check

# IWSDA Process Check
- hosts: da_dev
  become: false
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: IWSDA Process Check
      include_role:
        name: Workstation_control/da_process_check

# FTA Limit状態を作業前に戻す
- hosts: mdm_dev
  become: false
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Control IWSFTA WS Limit Control (After)
      include_role:
        name: Workstation_control/fta_ws_limit_control_after
      vars:
        fta_target_ws: "{{ item }}"
      loop: "{{ groups['fta_ws'] }}"

# FTA RMSTDLIST実行
- hosts: mdm_dev
  become: false
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: RMSTDLISTの実行
      include_role:
        name: Workstation_control/after_fta_check
      vars:
        JSControl: "{{ item }}"
      loop: "{{ IWSFTA_Aftercheck_JOB }}"
