        - gibsoapsap
        - gibweblistap
- name: Check Tomcat status before start
  shell: >
    ps -ef | grep java |
    grep -E '{{ tomcat_patterns[inventory_hostname] | join("|") }}' |
    grep -v grep || true
  register: tomcat_before
  changed_when: false
  failed_when: false

- name: Display Tomcat status before start
  debug:
    msg:
      - "***** Tomcat Status Before Start *****"
      - "{{ tomcat_before.stdout_lines | default([]) }}"

- name: Get Tomcat instance names
  shell: "/tools/tomcat/tomcat_start.sh | grep {{ item }} | awk '{print $NF}'"
  loop: "{{ tomcat_patterns[inventory_hostname] }}"
  register: tomcat_instance_names
  changed_when: false
  failed_when: false

- name: Display Tomcat instance names
  debug:
    msg:
      - "{{ item.item }}"
      - "{{ item.stdout }}"
  loop: "{{ tomcat_instance_names.results }}"
  when:
    - item.stdout | length > 0

- name: Tomcat起動 D&B shell
  shell: "/tools/tomcat/tomcat_start.sh {{ item.stdout }}"
  environment:
    LC_ALL: C
  loop: "{{ tomcat_instance_names.results }}"
  register: result_start_tomcat
  failed_when: false
  when:
    - item.stdout | length > 0

- name: Display start tomcat result
  debug:
    msg:
      - "==== {{ item.item.stdout | default('UNKNOWN') }} ===="
      - "{{ item.stdout_lines | default(['no output']) }}"
  loop: "{{ result_start_tomcat.results | default([]) }}"
  when:
    - result_start_tomcat is defined

- name: Check Tomcat status after start
  shell: >
    ps -ef | grep java |
    grep -E '{{ tomcat_patterns[inventory_hostname] | join("|") }}' |
    grep -v grep || true
  register: tomcat_after
  changed_when: false
  failed_when: false

- name: Display Tomcat status after start
  debug:
    msg:
      - "***** Tomcat Status After Start *****"
      - "{{ tomcat_after.stdout_lines | default([]) }}"

- name: Verify Tomcat instances are started
  fail:
    msg: "Tomcat instance {{ item }} is NOT running."
  when:
    - item not in (tomcat_after.stdout | default(''))
  loop: "{{ tomcat_patterns[inventory_hostname] }}"

- name: Tomcat started successfully
  debug:
    msg: "All Tomcat instances are running."
  when:
    - tomcat_after.stdout_lines | length > 0
