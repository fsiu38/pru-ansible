---
# Example only: replace server01 with an actual inventory hostname before testing.
- name: Define example before-phase process checks
  set_fact:
    check_process_king_examples:
      server01:
        before:
          up:
            - dmgr
            - nodeagent
          down:
            - "啟動中"

- name: Validate phase when supplied
  assert:
    that:
      - (check_phase | default('')) in ['', 'before', 'during', 'after']
    fail_msg: "check_phase must be empty, before, during, or after"

- name: Select phase checks or empty lists
  set_fact:
    check_process_king_up: "{{ (process_checks | default(check_process_king_examples)).get(inventory_hostname, {}).get(check_phase | default(''), {}).get('up', []) if (check_phase | default('') | length) > 0 else [] }}"
    check_process_king_down: "{{ (process_checks | default(check_process_king_examples)).get(inventory_hostname, {}).get(check_phase | default(''), {}).get('down', []) if (check_phase | default('') | length) > 0 else [] }}"

- name: Run process listing once (raw mode or configured phase checks)
  command: "{{ check_process_king_script | default('/prustaff/dsops/reboot/hanyo/check_process.sh') }}"
  register: check_process_king_result
  changed_when: false
  check_mode: false
  when: (check_phase | default('') | length) == 0 or (check_process_king_up | length + check_process_king_down | length) > 0

- name: Display process listing in raw mode
  debug:
    var: check_process_king_result.stdout_lines
  when: (check_phase | default('') | length) == 0

- name: Assert required output strings are present
  assert:
    that:
      - item in check_process_king_result.stdout
    fail_msg: "Missing required process text: {{ item }}"
  loop: "{{ check_process_king_up }}"

- name: Assert forbidden output strings are absent
  assert:
    that:
      - item not in check_process_king_result.stdout
    fail_msg: "Unexpected running process text: {{ item }}"
  loop: "{{ check_process_king_down }}"
