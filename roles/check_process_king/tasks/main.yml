---
- name: Validate requested phase
  assert:
    that:
      - check_phase in ['before', 'during', 'after']

- name: Select this host's phase checks
  set_fact:
    check_process_king_up: "{{ process_checks.get(inventory_hostname, {}).get(check_phase, {}).get('up', []) }}"
    check_process_king_down: "{{ process_checks.get(inventory_hostname, {}).get(check_phase, {}).get('down', []) }}"

- name: Run process listing once when checks exist
  command: "{{ check_process_king_script }}"
  register: check_process_king_result
  changed_when: false
  check_mode: false
  when: (check_process_king_up | length + check_process_king_down | length) > 0

- name: Assert required output strings are present
  assert:
    that:
      - item in check_process_king_result.stdout
    fail_msg: "Missing required process text: {{ item }}"
  loop: "{{ check_process_king_up }}"
  when: (check_process_king_up | length + check_process_king_down | length) > 0

- name: Assert forbidden output strings are absent
  assert:
    that:
      - item not in check_process_king_result.stdout
    fail_msg: "Unexpected running process text: {{ item }}"
  loop: "{{ check_process_king_down }}"
  when: (check_process_king_up | length + check_process_king_down | length) > 0
