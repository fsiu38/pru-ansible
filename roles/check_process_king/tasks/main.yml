---
- name: Validate requested check phase
  assert:
    that:
      - check_phase in ['before', 'during', 'after']
    fail_msg: "check_phase must be before, during, or after"

- name: Reset phase checks
  set_fact:
    check_process_king_items: []

- name: Build expected UP checks
  set_fact:
    check_process_king_items: "{{ check_process_king_items + [{'name': item, 'state': 'up'}] }}"
  loop: "{{ process_checks.get(inventory_hostname, {}).get(check_phase, {}).get('up', []) }}"

- name: Build expected DOWN checks
  set_fact:
    check_process_king_items: "{{ check_process_king_items + [{'name': item, 'state': 'down'}] }}"
  loop: "{{ process_checks.get(inventory_hostname, {}).get(check_phase, {}).get('down', []) }}"

- name: Run checks for selected server and phase
  shell: "{{ check_process_king_script | quote }} {{ item.name | quote }}"
  args:
    executable: /bin/sh
  loop: "{{ check_process_king_items }}"
  loop_control:
    label: "{{ item.name }} (expected {{ item.state }})"
  register: check_process_king_result
  changed_when: false
  failed_when: false
  check_mode: false

# This is a test-only runner. The script's output and return-code
# contract must be confirmed before implementing an up/down failure gate.
