---
- name: Check server kernel and processes
  hosts: all
  gather_facts: false

  tasks:
    - name: Run uname -a
      command:
        argv: [uname, -a]
      register: uname_result
      changed_when: false

    - name: Display uname output
      debug:
        msg: "{{ inventory_hostname }}: {{ uname_result.stdout }}"

    - name: Check expected processes
      include_role:
        name: check_process
