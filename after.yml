---
# 用途：OS Patch 後核對系統狀態。
# 執行內容：讀取目標機之前保存嘅 Kernel 資料、執行 uname -a、顯示前後差異，再呼叫原有 check_process Role。
# 注意：Kernel 差異只會顯示，唔會因為相同／不同而自動判定失敗；此處並非 check_process_king。

- name: Compare system state after OS patching
  hosts: all
  gather_facts: false
  tasks:
    - name: Read saved kernel information
      slurp:
        src: "~/tmp_os_before.txt"
      register: saved_kernel

    - name: Read current kernel information
      command: uname -a
      register: kernel_after
      changed_when: false

    - name: Compare kernel information (changes are expected after patching)
      debug:
        msg:
          before: "{{ (saved_kernel.content | b64decode) | trim }}"
          after: "{{ kernel_after.stdout }}"
          different: "{{ ((saved_kernel.content | b64decode) | trim) != kernel_after.stdout }}"

    - name: Check expected processes
      include_role:
        name: check_process
